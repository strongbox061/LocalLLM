# SearXNG settings snapshot — 2023-04-19
# Standalone config for Docker deployment

use_default_settings: true

general:
  instance_name: "LocalLLM Search"
  debug: false

search:
  safe_search: 0
  autocomplete: "google"
  default_lang: "auto"
  formats:
    - html
    - json

server:
  secret_key: "changeme-in-production"
  port: 8888
  bind_address: "0.0.0.0"
  limiter: false
  image_proxy: true

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: wikipedia
    engine: wikipedia
    shortcut: wp

  - name: bing
    engine: bing
    shortcut: b

  - name: github
    engine: github
    shortcut: gh

ui:
  static_use_hash: true
  default_theme: simple
  theme_args:
    style_simple: "auto"
  preferred_theme_dir: "light"
