# Kokoro text-to-speech server (CPU only), used by Open WebUI to read answers aloud in English, Spanish and French.
# Managed by install/kokoro.sh, start/kokoro.sh and stop/kokoro.sh. Not started at boot: start.sh starts it.
name: kokoro

services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.1
    container_name: kokoro
    ports:
      - "127.0.0.1:8880:8880"   # this machine only
    restart: "no"
    mem_limit: 3g
