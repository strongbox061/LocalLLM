<!doctype html>
<!-- Chat types of Open WebUI's protected chats, served by services/search_gateway.py at /chat-types
     (services/chat_types_web.py). Edits ~/.config/localllm/chat-types/<id>.json and runs install/chat-types.sh.
     Self-contained: no external scripts, styles or fonts. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Types</title>
  <link rel="stylesheet" href="chat_types_page.css">
</head>
<body>
  <main>
    <h1>Chat Types</h1>
    <p class="hint">Manage protected chat type presets for Open WebUI.</p>

    <div id="error"></div>

    <div class="layout">
      <section>
        <h2>Chat Types</h2>
        <div class="list" id="list"></div>
        <button id="new" class="new-btn">+ New chat type</button>
      </section>

      <div class="card" id="editor"><div class="empty">Pick a chat type, or make a new one.</div></div>
    </div>

    <div class="card job" id="job" hidden>
      <h2 id="job-title"></h2>
      <pre id="job-out"></pre>
    </div>
  </main>

  <script src="chat_types_page.js"></script>
</body>
</html>
