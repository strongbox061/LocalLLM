<!doctype html>
<!-- Search gateway settings, served by services/search_gateway.py at /settings (only to this computer).
     Reads /settings/data and saves with a JSON POST to /settings/save. API keys are never sent to this page: it
     only shows whether each one is set; a key field left empty keeps the key. Self-contained, works offline. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search gateway settings</title>
<link rel="stylesheet" href="/settings/search_gateway_settings.css">
</head>
<body>
<main>
<h1>Search gateway settings <a href="/dashboard">Usage</a></h1>
  <div class="sub">The search services, their API keys and order, and the limits, for Pi and Open WebUI alike.
    Saved to <code id="file">…</code> (only you can read it); the next search uses them.</div>
  <input class="filter" id="filter" type="search" placeholder="Filter settings (e.g. tavily, order, limit)">
  <form id="form"></form>
</main>
<div class="bar"><button id="save" type="button" disabled>Save</button><span id="msg"></span></div>
<script src="/settings/search_gateway_settings.js"></script>
</body>
</html>
